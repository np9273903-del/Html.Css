<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="
      display: grid;
      grid-template-columns:100px 100px;

    ">
   <div style="background-color:lightblue">div1</div> 
   <div style="background-color:lightgoldenrodyellow">div2</div> 
  </div>


   <div style="
      display: grid;
      grid-template-columns:100px 100px 100px;
      margin-top:20px;


    ">
   <div style="background-color:lightblue">div1</div> 
   <div style="background-color:lightgoldenrodyellow">div2</div> 
     <div style="background-color:rgb(144, 240, 202)">div3</div> 

  </div>



  <div style="
      display: grid;
      grid-template-columns:100px 100px 100px 1fr;
      margin-top:20px;
      

    ">
   <div style="background-color:lightblue">div1</div> 
   <div style="background-color:lightgoldenrodyellow">div2</div> 
   <div style="background-color:rgb(144, 240, 202)">div3</div> 
   <div style="background-color:rgb(123, 174, 231)">div4</div>
  </div>



    <div style="
    height:200px;
      display: grid;
      grid-template-columns:1fr 1fr 1fr;
      margin-top:20px;
      column-gap:20px;
      row-gap:20px;

    ">
   <div style="background-color:lightblue;">div1</div> 
   <div style="background-color:lightgoldenrodyellow">div2</div> 
     <div style="background-color:rgb(144, 240, 202)">div3</div> 
    <div style="background-color:lightblue">div1</div> 
   <div style="background-color:lightgoldenrodyellow">div2</div> 
     <div style="background-color:rgb(144, 240, 202)">div3</div> 
    
    
  </div>

</body>
</html>
