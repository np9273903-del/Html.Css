<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YouBox</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        /* -------------------- */
        /* Reset & Base */
        /* -------------------- */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f8f9fa;
            overflow-x: hidden;
            position: relative;
        }

        /* Simple gradient background like Google */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 40% 30% at 30% 20%, rgba(66, 133, 244, 0.08), transparent 60%),
                radial-gradient(ellipse 35% 25% at 70% 15%, rgba(234, 67, 53, 0.06), transparent 50%),
                radial-gradient(ellipse 30% 20% at 50% 80%, rgba(251, 188, 5, 0.06), transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        /* -------------------- */
        /* Container */
        /* -------------------- */

        .container {
            width: 95%;
            max-width: 1400px;
            margin: auto;
            padding: 40px 24px 60px;
            position: relative;
            z-index: 1;
        }

        /* -------------------- */
        /* Logo - Simple like Google */
        /* -------------------- */

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 48px;
            padding: 16px 24px;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 16px;
            transition: all 0.2s ease;
        }

        .logo:hover {
            background: rgba(0, 0, 0, 0.02);
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #4285f4, #34a853);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.25);
            flex-shrink: 0;
        }

        .logo-text h1 {
            font-size: 32px;
            color: #202124;
            letter-spacing: -0.5px;
            font-weight: 700;
            line-height: 1;
        }

        .logo-text span {
            color: #4285f4;
        }

        .logo-text p {
            color: #5f6368;
            font-size: 13px;
            font-weight: 400;
            margin-top: 2px;
            letter-spacing: 0.3px;
        }

        /* -------------------- */
        /* Search - Google Style */
        /* -------------------- */

        .search-container {
            display: flex;
            justify-content: center;
            margin-bottom: 32px;
        }

        .search-bar {
            width: 720px;
            display: flex;
            align-items: center;
            background: white;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 8px 8px 8px 20px;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.08);
            transition: all 0.2s ease;
        }

        .search-bar:hover {
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.15);
            border-color: #d2d4d8;
        }

        .search-bar:focus-within {
            box-shadow: 0 1px 8px rgba(66, 133, 244, 0.2);
            border-color: #4285f4;
        }

        .search-bar i {
            color: #4285f4;
            font-size: 20px;
            margin-right: 12px;
            opacity: 0.6;
        }

        .search-bar input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: #202124;
            font-size: 16px;
            padding: 12px 0;
            font-weight: 400;
        }

        .search-bar input::placeholder {
            color: #9aa0a6;
            font-weight: 400;
        }

        .search-bar button {
            border: none;
            background: #4285f4;
            color: white;
            padding: 10px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .search-bar button:hover {
            background: #1a73e8;
            box-shadow: 0 1px 4px rgba(66, 133, 244, 0.3);
        }

        .search-bar button i {
            color: white;
            font-size: 13px;
            margin-right: 0;
            opacity: 1;
        }

        .search-note {
            text-align: center;
            font-size: 13px;
            color: #5f6368;
            margin-top: 8px;
        }

        /* -------------------- */
        /* Layout */
        /* -------------------- */

        .main {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 28px;
            align-items: start;
        }

        /* -------------------- */
        /* Player - Google Style */
        /* -------------------- */

        .player-section {
            background: white;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #e8eaed;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.06);
            transition: all 0.2s ease;
        }

        .player-section:hover {
            box-shadow: 0 4px 12px rgba(32, 33, 36, 0.08);
        }

        #player {
            width: 100%;
            min-height: 440px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            overflow: hidden;
            background: #f1f3f4;
            position: relative;
        }

        #player iframe {
            width: 100%;
            height: 460px;
            border: none;
            border-radius: 12px;
        }

        .welcome {
            text-align: center;
            color: #202124;
            padding: 50px 30px;
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #4285f4, #34a853);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 4px 16px rgba(66, 133, 244, 0.2);
        }

        .welcome-icon i {
            font-size: 40px;
            color: white;
        }

        .welcome h2 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #202124;
        }

        .welcome p {
            color: #5f6368;
            font-size: 15px;
            font-weight: 400;
        }

        /* -------------------- */
        /* Controls - Simple */
        /* -------------------- */

        .controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 20px;
        }

        .control-btn {
            width: 52px;
            height: 52px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background: #f1f3f4;
            color: #202124;
            font-size: 18px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: #e8eaed;
            transform: scale(1.04);
        }

        .play-btn {
            width: 60px;
            height: 60px;
            background: #4285f4;
            color: white;
            box-shadow: 0 2px 8px rgba(66, 133, 244, 0.25);
        }

        .play-btn:hover {
            background: #1a73e8;
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.35);
        }

        /* -------------------- */
        /* Playlist - Clean */
        /* -------------------- */

        .playlist {
            background: white;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #e8eaed;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.06);
            max-height: 700px;
            overflow-y: auto;
            transition: all 0.2s ease;
        }

        .playlist:hover {
            box-shadow: 0 4px 12px rgba(32, 33, 36, 0.08);
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f1f3f4;
        }

        .playlist-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .playlist-title i {
            color: #4285f4;
            font-size: 18px;
        }

        .playlist-title h2 {
            color: #202124;
            font-size: 20px;
            font-weight: 600;
        }

        .count-badge {
            background: #f1f3f4;
            color: #5f6368;
            padding: 4px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
        }

        /* Playlist Items */
        .playlist-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .video-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .video-card:hover {
            background: #f8f9fa;
        }

        .video-card.active {
            background: #e8f0fe;
            border-color: #4285f4;
        }

        .video-left {
            display: flex;
            gap: 12px;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        .video-left img {
            width: 72px;
            height: 45px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
            background: #f1f3f4;
        }

        .video-info {
            color: #202124;
            min-width: 0;
        }

        .video-info h3 {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 1px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .video-info p {
            font-size: 12px;
            color: #5f6368;
            font-weight: 400;
            font-family: monospace;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .delete {
            color: #9aa0a6;
            font-size: 16px;
            padding: 6px 10px;
            border-radius: 8px;
            transition: all 0.2s ease;
            background: transparent;
            border: none;
            cursor: pointer;
            flex-shrink: 0;
        }

        .delete:hover {
            color: #d93025;
            background: rgba(217, 48, 37, 0.08);
        }

        /* Scrollbar - Clean */
        .playlist::-webkit-scrollbar {
            width: 4px;
        }

        .playlist::-webkit-scrollbar-track {
            background: transparent;
        }

        .playlist::-webkit-scrollbar-thumb {
            background: #dadce0;
            border-radius: 8px;
        }

        .playlist::-webkit-scrollbar-thumb:hover {
            background: #bdc1c6;
        }

        /* -------------------- */
        /* Empty State */
        /* -------------------- */

        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: #5f6368;
        }

        .empty-state i {
            font-size: 36px;
            color: #dadce0;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 14px;
            font-weight: 400;
        }

        /* -------------------- */
        /* Responsive */
        /* -------------------- */

        @media (max-width: 1024px) {
            .main {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .search-bar {
                width: 100%;
            }

            #player iframe {
                height: 380px;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 24px 16px 40px;
            }

            .logo {
                max-width: 100%;
                padding: 12px 16px;
            }

            .logo-icon {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }

            .logo-text h1 {
                font-size: 26px;
            }

            .search-bar {
                flex-wrap: wrap;
                padding: 12px;
                border-radius: 20px;
            }

            .search-bar input {
                width: 100%;
                padding: 10px 0;
                font-size: 15px;
            }

            .search-bar button {
                width: 100%;
                justify-content: center;
                padding: 12px;
                margin-top: 8px;
            }

            .player-section {
                padding: 16px;
            }

            #player iframe {
                height: 260px;
            }

            .playlist {
                max-height: 500px;
                padding: 16px;
            }

            .controls {
                gap: 12px;
            }

            .control-btn {
                width: 44px;
                height: 44px;
                font-size: 16px;
            }

            .play-btn {
                width: 52px;
                height: 52px;
            }

            .video-left img {
                width: 56px;
                height: 35px;
            }

            .welcome {
                padding: 30px 16px;
            }

            .welcome h2 {
                font-size: 22px;
            }
        }

        @media (max-width: 480px) {
            .logo-text h1 {
                font-size: 22px;
            }

            .logo-icon {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }

            #player iframe {
                height: 200px;
            }

            .playlist-title h2 {
                font-size: 17px;
            }

            .playlist-header {
                flex-direction: column;
                gap: 8px;
                align-items: flex-start;
            }
        }
    </style>

</head>

<body>

<div class="container">

    <!-- Logo -->
    <div class="logo">
        <div class="logo-icon">
            <i class="fa-regular fa-square"></i>
        </div>
        <div class="logo-text">
            <h1>You<span>Box</span></h1>
            <p>Watch YouTube Beautifully</p>
        </div>
    </div>

    <!-- Search -->
    <div class="search-container">
        <div class="search-bar">
            <i class="fa-regular fa-circle-play"></i>
            <input
            type="text"
            id="videoInput"
            placeholder="Paste YouTube link here...">
            <button id="addBtn">
                <i class="fa-regular fa-plus"></i> Add
            </button>
        </div>
    </div>
    <div class="search-note">Add any YouTube video or playlist link to get started</div>

    <!-- Main Area -->
    <div class="main">

        <!-- Video -->
        <div class="player-section">
            <div id="player">
                <div class="welcome">
                    <div class="welcome-icon">
                        <i class="fa-regular fa-square"></i>
                    </div>
                    <h2>Welcome to YouBox</h2>
                    <p>
                        Paste a YouTube URL above and add it to your playlist.
                    </p>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button id="prevBtn" class="control-btn">
                    <i class="fa-solid fa-backward"></i>
                </button>
                <button id="playBtn" class="control-btn play-btn">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button id="nextBtn" class="control-btn">
                    <i class="fa-solid fa-forward"></i>
                </button>
            </div>
        </div>

        <!-- Playlist -->
        <div class="playlist">
            <div class="playlist-header">
                <div class="playlist-title">
                    <i class="fa-regular fa-list"></i>
                    <h2>Playlist</h2>
                </div>
                <span id="count" class="count-badge">
                    0 Videos
                </span>
            </div>
            <div id="playlistItems" class="playlist-items">
                <!-- Playlist items will be rendered here -->
            </div>
        </div>

    </div>

</div>

<script>
    // ---------------------------
    // YouBox Playlist
    // ---------------------------

    const input = document.getElementById("videoInput");
    const addBtn = document.getElementById("addBtn");
    const playlistDiv = document.getElementById("playlistItems");
    const counter = document.getElementById("count");

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const playBtn = document.getElementById("playBtn");

    let playlist = JSON.parse(localStorage.getItem("youboxPlaylist")) || [];

    let currentIndex = 0;

    // -------------------------------
    // Load YouTube API
    // -------------------------------

    let tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    let player;

    // API Ready

    function onYouTubeIframeAPIReady(){

        player = new YT.Player("player",{

            width:"100%",

            height:"520",

            videoId:"",

            playerVars:{

                autoplay:1,

                rel:0

            },

            events:{

                onStateChange:onPlayerStateChange

            }

        });

    }

    // --------------------------------
    // Auto Next Video
    // --------------------------------

    function onPlayerStateChange(event){

        if(event.data == YT.PlayerState.ENDED){

            nextVideo();

        }

    }

    // --------------------------------
    // Extract Video ID
    // --------------------------------

    function getVideoID(url){

        if(url.includes("watch?v=")){

            return url.split("v=")[1].split("&")[0];

        }

        if(url.includes("youtu.be/")){

            return url.split("youtu.be/")[1].split("?")[0];

        }

        return null;

    }

    // --------------------------------
    // Add Video
    // --------------------------------

    addBtn.onclick = ()=>{

        const id = getVideoID(input.value);

        if(id==null){

            alert("Invalid YouTube URL");

            return;

        }

        playlist.push({

            id:id

        });

        localStorage.setItem(

            "youboxPlaylist",

            JSON.stringify(playlist)

        );

        input.value="";

        renderPlaylist();

        playVideo(

            playlist.length-1

        );

    };

    // Enter Key

    input.addEventListener("keypress",(e)=>{

        if(e.key==="Enter"){

            addBtn.click();

        }

    });

    // --------------------------------
    // Play Video
    // --------------------------------

    function playVideo(index){

        currentIndex=index;

        player.loadVideoById(

            playlist[index].id

        );

        highlight();

    }

    // --------------------------------
    // Previous
    // --------------------------------

    function previousVideo(){

        if(currentIndex>0){

            playVideo(

                currentIndex-1

            );

        }

    }

    // --------------------------------
    // Next
    // --------------------------------

    function nextVideo(){

        if(currentIndex<playlist.length-1){

            playVideo(

                currentIndex+1

            );

        }

    }

    // --------------------------------
    // Buttons
    // --------------------------------

    prevBtn.onclick=previousVideo;

    nextBtn.onclick=nextVideo;

    playBtn.onclick=()=>{

        player.playVideo();

    };

    // --------------------------------
    // Highlight
    // --------------------------------

    function highlight(){

        const cards=

        document.querySelectorAll(".video-card");

        cards.forEach(card=>{

            card.style.border="2px solid transparent";

        });

        if(cards[currentIndex]){

            cards[currentIndex].style.border=

            "2px solid #4285f4";

            cards[currentIndex].style.background="#e8f0fe";

        }

    }

    // --------------------------------
    // Delete
    // --------------------------------

    function deleteVideo(index){

        playlist.splice(index,1);

        localStorage.setItem(

            "youboxPlaylist",

            JSON.stringify(playlist)

        );

        renderPlaylist();

        if(playlist.length){

            playVideo(0);

        }else{

            document.getElementById("player").innerHTML=

            `<div class="welcome">
                <div class="welcome-icon">
                    <i class="fa-regular fa-square"></i>
                </div>
                <h2>No Videos</h2>
                <p>Add your first video to get started</p>
            </div>`;

        }

    }

    // --------------------------------
    // Render Playlist
    // --------------------------------

    function renderPlaylist(){

        playlistDiv.innerHTML="";

        counter.innerHTML=

        playlist.length+" Videos";

        if(playlist.length === 0){
            playlistDiv.innerHTML = `
                <div class="empty-state">
                    <i class="fa-regular fa-circle-play"></i>
                    <p>Your playlist is empty</p>
                </div>
            `;
            return;
        }

        playlist.forEach((video,index)=>{

            playlistDiv.innerHTML+=`

<div class="video-card">

<div class="video-left"

onclick="playVideo(${index})">

<img src="https://img.youtube.com/vi/${video.id}/mqdefault.jpg">

<div class="video-info">

<h3>

Video ${index+1}

</h3>

<p>

${video.id}

</p>

</div>

</div>

<button class="delete"

onclick="deleteVideo(${index})">

<i class="fa-regular fa-trash-can"></i>

</button>

</div>

`;

        });

        highlight();

    }

    // --------------------------------
    // Initial Load
    // --------------------------------

    renderPlaylist();

    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

    setTimeout(()=>{

        if(playlist.length){

            playVideo(0);

        }

    },1200);
</script>

</body>

</html>
